<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tugas2.html Kalkulator</title>

    <link rel="stylesheet" href="Kalkulator.css">
</head>

<body>

    <form action="#" method="post">

        <fieldset>

            <legend>Kalkulator</legend>

            <div>
                <label>Input Bilangan 1</label>
                <input type="number" id="bilangan1">
            </div>

            <div>
                <label>Input Bilangan 2</label>
                <input type="number" id="bilangan2">
            </div>

            <div style="margin-top: 5px; margin-left: 0px;">
                <button type="button" onclick="hitung('+')">+</button>
                <button type="button" onclick="hitung('-')">-</button>
                <button type="button" onclick="hitung('*')">x</button>
                <button type="button" onclick="hitung('/')">/</button>
            </div>

            <div style="margin-top: 5px;">
                <label>Output</label>
                <input type="text" id="output" readonly>
            </div>

        </fieldset>

    </form>


    <script>
        function hitung(operator) {

            let bilangan1 = Number(document.getElementById("bilangan1").value);
            let bilangan2 = Number(document.getElementById("bilangan2").value);
            let hasil;

            if (operator == "+") {
                hasil = bilangan1 + bilangan2;
            }

            else if (operator == "-") {
                hasil = bilangan1 - bilangan2;
            }

            else if (operator == "*") {
                hasil = bilangan1 * bilangan2;
            }

            else if (operator == "/") {
                hasil = bilangan1 / bilangan2;
            }

            document.getElementById("output").value = hasil;
        }
    </script>

</body>

</html>
